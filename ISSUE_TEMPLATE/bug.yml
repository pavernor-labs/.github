name: Bug
description: Something behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The observed behaviour, concretely.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or 04189c6
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Redact tokens, cookies, and personal data first.
      render: shell
    validations:
      required: false
